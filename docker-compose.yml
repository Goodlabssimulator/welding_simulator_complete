services:
  postgres:
    image: postgres:16-alpine
    container_name: weldsim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: welding_simulator
      POSTGRES_USER: welding_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-WeldingLocal2025!}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - weldsim-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U welding_admin -d welding_simulator"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weldsim-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: welding_simulator
      DB_USER: welding_admin
      DB_PASSWORD: ${DB_PASSWORD:-WeldingLocal2025!}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_change_in_production_please_change_me}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_change_in_production_please_change_me}
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
    ports:
      - "5000:5000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: /ws
    container_name: weldsim-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  weldsim-pgdata:
    name: weldsim-pgdata
